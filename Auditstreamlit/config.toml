## ❌ Muammolar va Yechimlari

### ❌ "Bot javob bermaydi"

**Sabab:** Terminal'da bot.py ishlamayapti
**Yechim:** Bot oynasiga qaytib, bot ishga tushganini tekshiring:
```bash
python bot.py
```

### ❌ "Invalid API key"

**Sabab:** TELEGRAM_TOKEN yoki GEMINI_API_KEY noto'g'ri
**Yechim:**
- @BotFather dan yangi token oling
- aistudio.google.com dan yangi API key oling
- `bot.py`'da o'zgartiring

### ❌ "urllib3.exceptions.MaxRetryError"

**Sabab:** Internet uzildi
**Yechim:** Bot avtomatik 5 soniyadan keyin qayta ulanadi — xavf yo'q

### ❌ "Gemini API kvotasi tugadi"

**Sabab:** Google API limit tugadi (free = 60 so'rovcha kuniga)
**Yechim:**
- Keyingi kun kutib oling
- yoki Gemini API'ga to'lov qo'ying (Google Cloud Console)

---

## 📝 Bot'ni 24/7 Ishlatish (Optimallashtirish)

Agarda bot hech vaqt to'xtab turmasligi uchun:

### Windows'da:
**Task Scheduler** orqali bot'ni avtomatik ishga tushirish:
1. "Task Scheduler" oching
2. "Create Basic Task" → "Bot" nomini bering
3. "Triggers" → "On startup"
4. "Actions" → Program: `python.exe` | Arguments: `C:\alshams\bot.py`
5. "OK" bosing

### Mac/Linux'da:
**crontab** orqali:
```bash
crontab -e
```
Quyidagini qo'shing:
```
@reboot python3 /home/user/alshams/bot.py > /tmp/bot.log 2>&1
```

---

## 📊 Bot Loglarini Ko'rish

Bot qaysi xatolar berish va qanday ishlayotganini ko'rish:
```bash
tail -f bot.log  # Real vaqtda log
```

Yoki Windows'da:
```cmd
type bot.log
```

